<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Year Countdown 2026</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            width: 1920px;
            height: 1080px;
            background: radial-gradient(circle at top, #1a1a3d, #000);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 80px;
            margin-bottom: 40px;
            letter-spacing: 4px;
        }

        .countdown {
            display: flex;
            gap: 40px;
            justify-content: center;
            margin-bottom: 60px;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px 40px;
            border-radius: 16px;
            min-width: 200px;
        }

        .number {
            font-size: 90px;
            font-weight: bold;
        }

        .label {
            font-size: 24px;
            margin-top: 10px;
            opacity: 0.8;
        }

        button {
            font-size: 22px;
            padding: 14px 32px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            background: #ffcc00;
            color: #000;
            font-weight: bold;
        }

        button:hover {
            background: #ffd633;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎉 NEW YEAR 2026 🎉</h1>

    <div class="countdown">
        <div class="time-box">
            <div class="number" id="days">0</div>
            <div class="label">DAYS</div>
        </div>
        <div class="time-box">
            <div class="number" id="hours">0</div>
            <div class="label">HOURS</div>
        </div>
        <div class="time-box">
            <div class="number" id="minutes">0</div>
            <div class="label">MINUTES</div>
        </div>
        <div class="time-box">
            <div class="number" id="seconds">0</div>
            <div class="label">SECONDS</div>
        </div>
    </div>

    <button onclick="toggleFullScreen()">⛶ Full Screen</button>
</div>

<script>
    // Target: January 1, 2026, 00:00:00 Philippines Time (UTC+8)
    const targetDate = new Date(
        new Intl.DateTimeFormat('en-US', {
            timeZone: 'Asia/Manila',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false
        }).format(new Date('2026-01-01T00:00:00'))
    );

    function updateCountdown() {
        const now = new Date(
            new Intl.DateTimeFormat('en-US', {
                timeZone: 'Asia/Manila',
                hour12: false
            }).format(new Date())
        );

        const diff = targetDate - now;

        if (diff <= 0) {
            document.querySelector('.countdown').innerHTML = 
                '<h2 style="font-size:80px">🎆 HAPPY NEW YEAR 2026! 🎆</h2>';
            return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / (1000 * 60)) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        document.getElementById('days').textContent = days;
        document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
        document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
        document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        } else {
            document.exitFullscreen();
        }
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
</script>

</body>
</html>
